name: HRM CMS Frontend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # ========================================
      # Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # Node
      # ========================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ========================================
      # OpenVPN
      # ========================================

      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn netcat-openbsd

      - name: Create VPN config
        run: |
          cat > vpn.ovpn <<'EOF'
          ${{ secrets.VPN_CONFIG }}
          EOF

          chmod 600 vpn.ovpn

      - name: Connect VPN
        run: |
          sudo openvpn \
            --config vpn.ovpn \
            --daemon \
            --log /tmp/openvpn.log

          echo "Waiting for VPN connection..."

          VPN_CONNECTED=false

          for i in {1..30}; do
            if ip addr show | grep -q "tun0"; then
              VPN_CONNECTED=true
              echo "VPN connected successfully."
              break
            fi

            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo ""
          echo "========== VPN LOG =========="
          sudo cat /tmp/openvpn.log
          echo "============================="

          if [ "$VPN_CONNECTED" != "true" ]; then
            echo "VPN connection failed."
            exit 1
          fi

      # ========================================
      # Test SSH Port
      # ========================================

      - name: Test SSH port
        run: |
          echo "Testing ${{ secrets.SSH_HOST }}:22..."

          nc -zv -w 10 \
            ${{ secrets.SSH_HOST }} \
            22

          echo "SSH port is reachable!"

      # ========================================
      # Install dependencies
      # ========================================

      - name: Install dependencies
        run: npm ci

      # ========================================
      # Build
      # ========================================

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL_API: ${{ secrets.VITE_BASE_URL_API }}
          VITE_MODE: ${{ secrets.VITE_MODE }}

      # ========================================
      # Upload build/client to EC2
      # ========================================

      - name: Upload build/client to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: 'build/client/*'
          target: '/home/thangvo/deploy'

      # ========================================
      # Deploy (serve on fixed port 1010)
      # ========================================

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            APP_PORT=1010
            APP_DIR=/var/www/hrm-cms-frontend
            NGINX_CONF=/etc/nginx/sites-available/hrm-cms-frontend

            echo "Starting deployment..."

            sudo mkdir -p $APP_DIR
            sudo rm -rf $APP_DIR/*

            sudo cp -r /home/thangvo/deploy/build/client/* $APP_DIR/

            sudo chown -R www-data:www-data $APP_DIR

            sudo find $APP_DIR -type d -exec chmod 755 {} \;
            sudo find $APP_DIR -type f -exec chmod 644 {} \;

            echo "Writing Nginx config (port $APP_PORT)..."

            sudo tee $NGINX_CONF > /dev/null <<EOF
            server {
                listen ${APP_PORT};
                listen [::]:${APP_PORT};
                server_name _;

                root $APP_DIR;
                index index.html;

                location / {
                    try_files \$uri \$uri/ /index.html;
                }

                location /assets/ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
            }
            EOF

            sudo ln -sf $NGINX_CONF /etc/nginx/sites-enabled/hrm-cms-frontend

            if command -v ufw > /dev/null && sudo ufw status | grep -q "Status: active"; then
              echo "Opening port $APP_PORT on ufw..."
              sudo ufw allow ${APP_PORT}/tcp
            fi

            echo "Testing Nginx configuration..."

            sudo nginx -t

            echo "Reloading Nginx..."

            sudo systemctl reload nginx

            echo "Checking http://localhost:$APP_PORT ..."

            curl -fsS -o /dev/null http://localhost:$APP_PORT

            echo "Deployment completed successfully on port $APP_PORT!"

      - name: Notify Slack Success
        if: success()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --data '{
              "attachments": [
                {
                  "color": "#2EB67D",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🚀 HRM CMS FE Deploy Success"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "Frontend deployment completed successfully. 🎉"
                      }
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*🌿 Branch*\n`${{ github.ref_name }}`\n\n*👤 Author*\n`${{ github.actor }}`\n\n*📂 Repository*\n`${{ github.repository }}`\n\n*⚙️ Workflow*\n`${{ github.workflow }}`\n\n*🏃 Run*\n`#${{ github.run_number }}`\n\n*🌍 Environment*\n`dev`\n\n*🔌 Port*\n`1010`"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "📄 View Commit"
                          },
                          "url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
                        },
                        {
                          "type": "button",
                          "style": "primary",
                          "text": {
                            "type": "plain_text",
                            "text": "🚀 Open Workflow"
                          },
                          "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }'

      - name: Notify Slack Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --data '{
              "attachments": [
                {
                  "color": "#E01E5A",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🚨 HRM CMS FE Deploy Failed"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "Frontend deployment failed. Please check the workflow logs."
                      }
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*🌿 Branch*\n`${{ github.ref_name }}`\n\n*👤 Author*\n`${{ github.actor }}`\n\n*📂 Repository*\n`${{ github.repository }}`\n\n*⚙️ Workflow*\n`${{ github.workflow }}`\n\n*🏃 Run*\n`#${{ github.run_number }}`\n\n*🌍 Environment*\n`dev`"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "📄 View Commit"
                          },
                          "url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
                        },
                        {
                          "type": "button",
                          "style": "danger",
                          "text": {
                            "type": "plain_text",
                            "text": "🔍 Open Workflow"
                          },
                          "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }'
